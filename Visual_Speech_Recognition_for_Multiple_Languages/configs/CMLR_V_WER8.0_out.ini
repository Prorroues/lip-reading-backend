[decode]
# Original CMLR news-model decode (restored 2026-10-14).
# Home command CTC scoring is unused; backups:
#   pipelines/command_decode.py              overlap-gated (score = nll/sqrt(len) - 3.0*hits, MAX_NLL=40, MIN_MARGIN=0.3)
#   pipelines/command_decode_openvocab.py    same snapshot
#   pipelines/command_decode_closedvocab.py  closed-vocab (raw nll - 8.0*hits, close need=2.5)
beam_size=20
penalty=0.3
maxlenratio=0.0
minlenratio=0.0
ctc_weight=0.1
lm_weight=0.3
